name: Digital Productivity Assistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall -q app

      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"OK: {path}")
          PY

      - name: CLI smoke test
        run: printf '1\n1\n' | python app/main.py

      - name: Web assets
        run: |
          test -s index.html
          test -s web/app.js
          test -s web/styles.css

      - name: Portfolio documentation
        run: |
          for file in README.md README.en.md README.es.md; do
            test -s "$file"
            grep -q "Filipe G Morais" "$file"
            grep -q "github.com/sayjinblackbelt" "$file"
          done

      - name: Secret pattern check
        run: |
          if grep -RInE '(AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' . --exclude-dir=.git; then
            echo "Potential secret detected."
            exit 1
          fi
